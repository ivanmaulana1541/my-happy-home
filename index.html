<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button id="btn-home">🏠 Rumah</button>
      <button id="btn-school">🏫 Sekolah</button>
    </div>
  </header>

  <!-- ================= HOME WORLD ================= -->
  <section class="world home active">

    <div class="sub-nav">
      <button id="btn-bedroom">🛏️ Kamar</button>
      <button id="btn-kitchen">🍳 Dapur</button>
    </div>

    <!-- BEDROOM -->
    <div class="room bedroom active">
      <div class="item bed">🛏️</div>
      <div class="item wardrobe">👗</div>

      <div class="person">
        <img src="./assets/child.png" alt="Syabil">
      </div>
    </div>

    <!-- KITCHEN -->
    <div class="room kitchen">
      <div class="food-container">
        <div class="food">🍎</div>
        <div class="food">🍞</div>
        <div class="food">🍰</div>
      </div>

      <div class="person">
        <img src="./assets/child.png" alt="Syabil">
      </div>
    </div>

  </section>

  <!-- ================= SCHOOL WORLD ================= -->
  <section class="world school">

    <h2 class="school-title">🏫 Sekolah Syabil</h2>

    <div class="school-area">
      <div class="item">📚</div>
      <div class="item">✏️</div>
      <div class="item">🧠</div>
    </div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>

  </section>

</div>

<script src="./script.js"></script>
</body>
</html>
