<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fcefee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .home {
      width: 80vw;
      max-width: 1000px;
      height: 60vh;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      margin: 0;
      color: #ff7aa2;
    }

    p {
      color: #555;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="home">
    <h1>🏡 My Happy Home</h1>
    <p>Hello Syabil 💕</p>
    <p>Game ini sedang dibangun...</p>
  </div>

</body>
</html>
