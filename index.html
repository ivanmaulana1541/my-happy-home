<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button data-area="home">🏠 Rumah</button>
      <button data-area="bedroom">🛏️ Kamar</button>
      <button data-area="kitchen">🍳 Dapur</button>
      <button data-area="school">🏫 Sekolah</button>
    </div>
  </header>

  <!-- QUEST BUTTON -->
  <button id="btn-quest" class="quest-btn">📋 Quest</button>

  <!-- QUEST PANEL -->
  <div id="quest-panel" class="quest-panel hidden">
    <h3>📋 Misi Hari Ini</h3>
    <ul>
      <li id="q-wakeup">⬜ Bangun tidur</li>
      <li id="q-eat">⬜ Makan pagi</li>
      <li id="q-school">⬜ Berangkat sekolah</li>
    </ul>
  </div>

  <!-- 🏠 HOME -->
  <div class="room home active">

    <!-- Father -->
    <div class="person father">
      <img src="./assets/father.png" alt="Father">
    </div>

    <!-- Mother -->
    <div class="person mother">
      <img src="./assets/mother.png" alt="Mother">
    </div>

    <!-- Child -->
    <div class="person child">
      <img src="./assets/child.png" alt="Syabil">
    </div>

  </div>

  <!-- 🛏️ BEDROOM -->
  <div class="room bedroom">
    <div class="item bed">🛏️</div>
    <div class="item wardrobe">👗</div>
    <div class="person child">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🍳 KITCHEN -->
  <div class="room kitchen">
    <div class="food-container">
      <div class="food">🍎</div>
      <div class="food">🍞</div>
      <div class="food">🍰</div>
    </div>
    <div class="person child">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🏫 SCHOOL -->
  <div class="room school">
    <div class="person child">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

</div>

<script src="./script.js"></script>
</body>
</html>
