<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- GLOBAL NAV (PINDAH AREA) -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button id="go-home">🏠 Rumah</button>
      <button id="go-school">🏫 Sekolah</button>
    </div>
  </header>

  <!-- ===================== -->
  <!-- 🏠 AREA RUMAH -->
  <!-- ===================== -->
  <div class="area home active">

    <!-- NAV DALAM RUMAH -->
    <div class="sub-nav">
      <button id="btn-bedroom">🛏️ Kamar</button>
      <button id="btn-kitchen">🍳 Dapur</button>
    </div>

    <!-- BEDROOM -->
    <div class="room bedroom active">
      <div class="item bed">🛏️</div>
      <div class="item wardrobe">👗</div>

      <!-- KELUARGA -->
      <div class="family">
        <div class="person father">
          <img src="./assets/father.png" alt="Ayah">
        </div>

        <div class="person child">
          <img src="./assets/child.png" alt="Syabil">
        </div>

        <div class="person mother">
          <img src="./assets/mother.png" alt="Ibu">
        </div>
      </div>
    </div>

   <!-- SCHOOL -->
<div class="room school">

  <h2 class="area-title">🏫 Sekolah Syabil</h2>

  <!-- SCHOOL ITEMS -->
  <div class="school-items">
    <div class="school-item desk">🪑</div>
    <div class="school-item book">📚</div>
  </div>

  <!-- CHARACTERS -->
  <div class="school-characters">
    <img class="teacher" src="./assets/mother.png" alt="Guru">
    <img class="child" src="./assets/child.png" alt="Syabil">
  </div>

</div>


  </div>

  <!-- ===================== -->
  <!-- 🏫 AREA SEKOLAH -->
  <!-- ===================== -->
  <div class="area school">

    <div class="school-room">
      <h2>🏫 Sekolah Syabil</h2>

      <div class="school-items">
        <div class="desk">🪑</div>
        <div class="book">📚</div>
        <div class="teacher">👩‍🏫</div>
      </div>

      <div class="person child">
        <img src="./assets/child.png" alt="Syabil">
      </div>
    </div>

  </div>

</div>

<script src="./script.js"></script>
</body>
</html>
