<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>
    <div class="nav">
      <button data-scene="room">🏠 Rumah</button>
      <button data-scene="map">🗺️ Map</button>
    </div>
  </header>

  <!-- SCENE CONTAINER -->
  <div id="scene-container">

    <!-- BEDROOM -->
    <div class="scene active" data-scene="room"
      style="background-image:url('./assets/background/room.png')">
      <div class="character" id="char-syabil"></div>
      <div class="door" data-action="toKitchen">🚪</div>
    </div>

    <!-- HOME (RUANG KELUARGA) -->
    <div class="scene" data-scene="home"
      style="background-image:url('./assets/background/home.png')">
    </div>

    <!-- KITCHEN -->
    <div class="scene" data-scene="kitchen"
      style="background-image:url('./assets/background/kitchen.png')">
      <div class="character papa"></div>
      <div class="character mama"></div>
      <div class="character" id="char-syabil-kitchen"></div>
      <div class="food" data-action="eat">🍽️</div>
      <div class="door" data-action="toMap">🚪</div>
    </div>

    <!-- MAP -->
    <div class="scene" data-scene="map"
      style="background-image:url('./assets/background/map.png')">
      <img class="map-icon" src="./assets/icons/citraberkat.png" data-action="toSchool" />
      <img class="map-icon" src="./assets/icons/office.png" data-action="toOffice" />
      <img class="map-icon" src="./assets/icons/freshmarket.png" data-action="toMarket" />
      <img class="map-icon" src="./assets/icons/house.png" data-action="toHome" />
      <img class="map-icon" src="./assets/icons/dufan.png" data-action="toDufan" />
    </div>

    <!-- SCHOOL -->
    <div class="scene" data-scene="school"
      style="background-image:url('./assets/background/school.png')">
      <div class="character teacher"></div>
    </div>

    <!-- OFFICE -->
    <div class="scene" data-scene="office"
      style="background-image:url('./assets/background/office.png')">
      <div class="character papa"></div>
    </div>

    <!-- MARKET -->
    <div class="scene" data-scene="market"
      style="background-image:url('./assets/background/market.png')">
      <div class="character mama"></div>
      <div class="food" data-action="shop">🛒</div>
    </div>

    <!-- DUFAN -->
    <div class="scene" data-scene="dufan"
      style="background-image:url('./assets/background/dufanroom.png')">
      <div class="character family-dufan"></div>
    </div>

  </div>

  <!-- DIALOG -->
  <div class="dialog">
    <p id="dialog-text"></p>
    <div id="dialog-actions"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
