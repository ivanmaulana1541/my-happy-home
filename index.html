
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

<!-- 🛏️ KAMAR SYABIL (START GAME) -->
<div class="room room active">
  <div class="item wardrobe">👗</div>
  <div class="person child"><img></div>
</div>

<!-- 🛏️ BEDROOM (PAPA MAMA) -->
<div class="room bedroom">
  <!-- (kosong dulu, atau nanti isi Papa Mama kalau mau) -->
</div>

<!-- 🍳 KITCHEN -->
<div class="room kitchen">
  <div class="food-container">
    <div class="food">🍎</div>
    <div class="food">🍞</div>
  </div>
  <div class="person child"><img></div>
  <div class="person father"><img src="./assets/father.png"></div>
  <div class="person mother"><img src="./assets/mother.png"></div>
</div>

<!-- 🗺️ MAP -->
<div class="room map">
  <div class="map-icon school-icon">
    <img src="./assets/icons/citraberkat.png" alt="Pergi ke Sekolah">
  </div>

  <div class="map-icon home-icon">
    <img src="./assets/icons/house.png" alt="Home">
  </div>

  <img class="car hidden" src="./assets/icons/car.png" alt="car">
</div>



<!-- 🏫 SCHOOL -->
<div class="room school">
  <div class="person teacher"><img src="./assets/msputri.png"></div>
  <div class="person child"><img></div>

  <!-- 📘 MINI GAME SEKOLAH -->
  <div class="quiz hidden">
    <div class="question">105 + 12 = ?</div>
    <button class="answer" data-value="117">117</button>
    <button class="answer" data-value="120">120</button>
  </div>

  <!-- 👕 ICON GANTI BAJU OLAHRAGA -->
  <div class="school-dress-icon hidden">👕</div>

  <!-- 🏀 ICON BASKET (muncul setelah quiz) -->
  <div class="school-basket-icon hidden">🏀</div>
</div>

<!-- =====================
     ROOM BASKET
===================== -->
<div class="room basket">
  <div class="basket-ui">

    <!-- SCORE -->
    <div class="basket-score">0 / 3</div>

    <!-- RING (hitbox, invisible via CSS) -->
    <div class="basket-ring"></div>

    <!-- 🔴 NEW: SYABIL (OLAHRAGA) DI SCENE BASKET -->
    <div class="person child basket-child">
      <img src="./assets/child_sport.png">
    </div>

    <!-- POWER BAR -->
    <div class="power-bar">
      <div class="power-indicator"></div>
    </div>

    <!-- BALL -->
    <div class="basket-ball"></div>

    <!-- SHOOT BUTTON -->
    <button class="shoot-btn">SHOOT</button>

  </div>
</div>

<!-- DIALOG -->
<div id="dialog-box" class="dialog hidden">
  <div class="dialog-speaker"></div>
  <div class="dialog-text"></div>
  <button id="dialog-next">Next</button>
</div>

</div>

<script src="./script.js"></script>
</body>
</html>
