<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button data-area="home">🏠 Rumah</button>
      <button data-area="bedroom">🛏️ Kamar</button>
      <button data-area="kitchen">🍳 Dapur</button>
      <button data-area="school">🏫 Sekolah</button>
      <button data-area="office">🏢 Kantor</button>
      <button data-area="market">🛒 Market</button>
    </div>
  </header>

  <!-- QUEST BUTTON (nanti dipakai lagi) -->
  <button id="btn-quest" class="quest-btn">📋 Quest</button>

  <!-- 🏠 HOME -->
  <div class="room home">
    <div class="person father"><img src="./assets/father.png"></div>
    <div class="person mother"><img src="./assets/mother.png"></div>
    <div class="person child"><img src="./assets/piyama.png"></div>
  </div>

  <!-- 🛏️ BEDROOM -->
  <div class="room bedroom active">
    <div class="item wardrobe">👗</div>
    <div class="person child"><img src="./assets/child.png"></div>
  </div>

  <!-- 🍳 KITCHEN -->
  <div class="room kitchen">
    <div class="food-container">
      <div class="food">🍎</div>
      <div class="food">🍞</div>
      <div class="food">🍰</div>
    </div>
    <div class="person child"><img src="./assets/child.png"></div>
    <div class="person father"><img src="./assets/father.png"></div>
    <div class="person mother"><img src="./assets/mother.png"></div>
  </div>

    <!-- 🗺️ MAP -->
  <div class="room map">
    <div class="map-icon school-icon">🏫 Sekolah</div>
  </div>

  <!-- 🏫 SCHOOL -->
  <div class="room school">
    <div class="person child">
      <img src="./assets/child.png">
    </div>
  </div>


  <!-- DIALOG BOX -->
  <div id="dialog-box" class="dialog hidden">
    <div class="dialog-speaker"></div>
    <div class="dialog-text"></div>
    <button id="dialog-next">Next</button>
  </div>

</div>

<script src="./script.js"></script>
</body>
</html>
