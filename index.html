<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    <div class="nav">
      <button data-area="bedroom">🛏️ Kamar</button>
      <button data-area="kitchen">🍳 Dapur</button>
      <button data-area="school">🏫 Sekolah</button>
      <button data-area="office">🏢 Kantor</button>
      <button data-area="market">🛒 Market</button>
      <button data-area="yogaroom">🧘 Yoga</button>
      <button data-area="dufan">🎢 Dufan</button>
    </div>
  </header>

  <!-- QUEST BUTTON -->
  <button id="btn-quest" class="quest-btn">📋 Quest</button>

  <!-- QUEST PANEL -->
  <div id="quest-panel" class="quest-panel hidden">
    <div class="quest-tabs">
      <button class="tab active" data-tab="child">👧 Syabil</button>
      <button class="tab" data-tab="father">👨 Papa</button>
      <button class="tab" data-tab="mother">👩 Mama</button>
    </div>
    <ul id="quest-list"></ul>
  </div>

  <!-- ROOMS -->
  <div class="room bedroom active">
    <div class="item wardrobe">👗</div>
    <div class="person child"><img src="./assets/child.png"></div>
    <div class="person father"><img src="./assets/father.png"></div>
    <div class="person mother"><img src="./assets/mother.png"></div>
  </div>

  <div class="room kitchen">
    <div class="food-container">
      <div class="food">🍎</div>
    </div>
    <div class="person child"><img src="./assets/child.png"></div>
    <div class="person father"><img src="./assets/father.png"></div>
    <div class="person mother"><img src="./assets/mother.png"></div>
  </div>

  <div class="room school">
    <div class="person child"><img src="./assets/child.png"></div>
  </div>

  <div class="room office">
    <div class="person father"><img src="./assets/father.png"></div>
  </div>

  <div class="room yogaroom">
    <div class="person mother"><img src="./assets/mother.png"></div>
  </div>

  <div class="room market">
    <div class="person mother"><img src="./assets/mother.png"></div>
  </div>

  <div class="room dufanroom">
    <div class="person child"><img src="./assets/syabildufan.png"></div>
    <div class="person father"><img src="./assets/papadufan.png"></div>
    <div class="person mother"><img src="./assets/mamadufan.png"></div>
  </div>

  <div id="feedback" class="feedback hidden"></div>

</div>

<script src="./script.js"></script>
</body>
</html>
