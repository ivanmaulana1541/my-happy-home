<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>
    <div class="nav">
      <button data-scene="home">🏠 Rumah</button>
      <button data-scene="map">🗺️ Map</button>
    </div>
  </header>

  <div id="scene-container">

    <!-- KAMAR SYABIL -->
    <div class="scene active" data-scene="room"
      style="background-image:url('./assets/background/room.png')">
      <div class="character syabil" id="syabil-room"></div>
      <div class="door" data-action="toKitchen">🚪</div>
    </div>

    <!-- KAMAR PAPA & MAMA -->
    <div class="scene" data-scene="bedroom"
      style="background-image:url('./assets/background/bedroom.png')">
      <div class="character papa"></div>
      <div class="character mama"></div>
      <div class="door" data-action="toMap">🚪</div>
    </div>

    <!-- HOME -->
    <div class="scene" data-scene="home"
      style="background-image:url('./assets/background/home.png')">
      <div class="character syabil" id="syabil-home"></div>
    </div>

    <!-- KITCHEN -->
    <div class="scene" data-scene="kitchen"
      style="background-image:url('./assets/background/kitchen.png')">
      <div class="character papa"></div>
      <div class="character mama"></div>
      <div class="character syabil" id="syabil-kitchen"></div>
      <div class="food" data-action="eat">🍽️</div>
      <div class="door" data-action="toMap">🚪</div>
    </div>

    <!-- MAP -->
    <div class="scene" data-scene="map"
      style="background-image:url('./assets/background/map.png')">
      <img src="./assets/icons/citraberkat.png" class="map-icon" data-action="toSchool">
      <img src="./assets/icons/house.png" class="map-icon" data-action="toHome">
      <img src="./assets/icons/office.png" class="map-icon" data-action="toOffice">
      <img src="./assets/icons/freshmarket.png" class="map-icon" data-action="toMarket">
      <img src="./assets/icons/dufan.png" class="map-icon" data-action="toDufan">
    </div>

    <!-- SCHOOL -->
    <div class="scene" data-scene="school"
      style="background-image:url('./assets/background/school.png')">
      <div class="character teacher"></div>
    </div>

  </div>

  <!-- DIALOG -->
  <div class="dialog">
    <p id="dialog-text"></p>
    <div id="dialog-actions"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
