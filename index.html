<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button data-area="bedroom">🛏️ Kamar</button>
      <button data-area="kitchen">🍳 Dapur</button>
      <button data-area="school">🏫 Sekolah</button>
      <button data-area="office">🏢 Kantor</button>
      <button data-area="market">🛒 Market</button>
      <button data-area="home">🏠 Rumah</button>
    </div>
  </header>

  <!-- QUEST BUTTON -->
  <button id="btn-quest" class="quest-btn">📋 Quest</button>

  <!-- QUEST PANEL -->
  <div id="quest-panel" class="quest-panel hidden">
    <h3>📋 Misi Keluarga</h3>
    <ul id="quest-list">
      <li>👧 Syabil: Sekolah & pulang</li>
      <li>👨 Papa: Makan & kerja</li>
      <li>👩 Mama: Makan & belanja</li>
    </ul>
  </div>

  <!-- BEDROOM -->
  <div class="room bedroom active">
    <div class="item wardrobe">👗</div>
    <div class="person child"><img id="child-img" src="./assets/child.png"></div>
    <div class="person mother"><img src="./assets/mother.png"></div>
  </div>

  <!-- KITCHEN -->
  <div class="room kitchen">
    <div class="food-container">
      <div class="food">🍎</div>
    </div>
    <div class="person child"><img src="./assets/child.png"></div>
    <div class="person father"><img src="./assets/father.png"></div>
    <div class="person mother"><img src="./assets/mother.png"></div>
  </div>

  <!-- SCHOOL -->
  <div class="room school">
    <div class="person child"><img src="./assets/child.png"></div>
  </div>

  <!-- OFFICE -->
  <div class="room office">
    <div class="person father"><img src="./assets/father.png"></div>
  </div>

  <!-- MARKET -->
  <div class="room market">
    <div class="person mother"><img src="./assets/mother.png"></div>
  </div>

  <!-- HOME -->
  <div class="room home">
    <div class="item door">🚪</div>
    <div class="person child"><img src="./assets/child.png"></div>
    <div class="person father"><img src="./assets/father.png"></div>
    <div class="person mother"><img src="./assets/mother.png"></div>
  </div>

  <!-- FEEDBACK -->
  <div id="feedback" class="feedback hidden"></div>

</div>

<script src="./script.js"></script>
</body>
</html>
