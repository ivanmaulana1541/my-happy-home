<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button data-area="map">🗺️ Map</button>
      <button data-area="home">🏠 Home</button>
      <button data-area="kitchen">🍳 Dapur</button>
      <button data-area="school">🏫 Sekolah</button>
      <button data-area="office">🏢 Kantor</button>
      <button data-area="market">🛒 Market</button>
    </div>
  </header>

  <!-- QUEST BUTTON -->
  <button id="btn-quest" class="quest-btn">📋 Quest</button>

  <!-- QUEST PANEL -->
  <div id="quest-panel" class="quest-panel">
    <h3>📋 Quest Syabil</h3>
    <ul id="quest-list">
      <li class="done">Bangun (kamar Syabil)</li>
      <li id="q-eat">Makan (dapur)</li>
      <li>Sekolah</li>
      <li>Pulang ke Home</li>
    </ul>
  </div>

  <!-- MAP -->
  <div class="room map active">
    <!-- hanya background -->
  </div>

  <!-- HOME -->
  <div class="room home">
    <div class="person papa">
      <img src="./assets/father.png">
    </div>

    <div class="person child">
      <img src="./assets/child.png">
    </div>

    <div class="person mama">
      <img src="./assets/mother.png">
    </div>
  </div>

  <!-- DAPUR -->
  <div class="room kitchen">

    <!-- ICON MAKAN -->
    <div class="food" data-action="eat">🍽️</div>

    <div class="person child">
      <img src="./assets/child.png">
    </div>
  </div>

  <!-- SEKOLAH -->
  <div class="room school">
    <div class="person child center">
      <img src="./assets/child.png">
    </div>
  </div>

  <!-- KANTOR -->
  <div class="room office"></div>

  <!-- MARKET -->
  <div class="room market"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const rooms = document.querySelectorAll(".room");
  const navButtons = document.querySelectorAll(".nav button");
  const questBtn = document.getElementById("btn-quest");
  const questPanel = document.getElementById("quest-panel");
  const eatQuest = document.getElementById("q-eat");

  function switchRoom(name) {
    rooms.forEach(r => r.classList.remove("active"));
    document.querySelector(".room." + name)?.classList.add("active");
  }

  navButtons.forEach(btn => {
    btn.onclick = () => switchRoom(btn.dataset.area);
  });

  questBtn.onclick = () => {
    questPanel.classList.toggle("hidden");
  };

  document.querySelectorAll(".food").forEach(food => {
    food.onclick = () => {
      eatQuest.classList.add("done");
    };
  });

});
</script>

</body>
</html>
