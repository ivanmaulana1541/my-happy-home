<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game">

    <!-- TOP BAR -->
    <header class="top-bar">
      ⭐ <span id="star-count">0</span>

      <div class="nav">
        <button id="btn-bedroom">🛏️ Kamar</button>
        <button id="btn-kitchen">🍳 Dapur</button>
      </div>
    </header>

    <!-- BEDROOM -->
    <div class="room bedroom active">
      <div class="bed">🛏️</div>
      <div class="wardrobe">👗</div>
      <div class="girl">👧</div>
    </div>

    <!-- KITCHEN -->
    <div class="room kitchen">
      <div class="food">🍎</div>
      <div class="food">🍞</div>
      <div class="food">🍰</div>
      <div class="girl">👧</div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
