<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button data-area="bedroom">🛏️ Kamar</button>
      <button data-area="kitchen">🍳 Dapur</button>
      <button data-area="school">🏫 Sekolah</button>
      <button data-area="home">🏠 Rumah</button>
      <button data-area="office">🏢 Kantor</button>
      <button data-area="market">🛒 Market</button>
      <button data-area="yogaroom">🧘 Yoga</button>
      <button data-area="dufanroom">🎢 Dufan</button>
    </div>
  </header>

  <!-- QUEST BUTTON -->
  <button id="btn-quest" class="quest-btn">📋 Quest</button>

  <!-- QUEST PANEL -->
  <div id="quest-panel" class="quest-panel hidden">
    <h3>📋 Misi Syabil</h3>
    <ul id="quest-list">
      <li>⬜ Ganti baju sekolah</li>
      <li>⬜ Makan pagi</li>
      <li>⬜ Berangkat sekolah</li>
      <li>⬜ Pulang ke rumah</li>
    </ul>
  </div>

  <!-- 🗺️ MAP (ADA, TAPI TIDAK DIPAKAI DI STEP 1) -->
  <div class="room map">
    <div class="map-icon home-icon"></div>
  </div>

  <!-- 🛏️ BEDROOM (START GAME DI SINI) -->
  <div class="room bedroom active">
    <div class="item wardrobe">👗</div>
    <div class="person child">
      <img id="child-img" src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🍳 KITCHEN -->
  <div class="room kitchen">
    <div class="food-container">
      <div class="food">🍎</div>
    </div>
    <div class="person child">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🏫 SCHOOL -->
  <div class="room school">
    <div class="person child">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🏠 HOME -->
  <div class="room home">
    <div class="person child">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🧘 YOGA ROOM -->
  <div class="room yogaroom">
    <div class="person child">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🎢 DUFAN ROOM -->
  <div class="room dufanroom">
    <div class="person child">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- FEEDBACK TEXT -->
  <div id="feedback" class="feedback hidden"></div>

</div>

<script src="./script.js"></script>
</body>
</html>
