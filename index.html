<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    ⭐ <span id="star">0</span>
  </div>

  <!-- GAME AREA -->
  <div id="game">

    <!-- BACKGROUND -->
    <img
      id="background"
      src="assets/background/room.png"
      alt="Kamar Syabil"
    />

    <!-- SYABIL -->
    <img
      id="syabil-img"
      src="assets/child.png"
      alt="Syabil"
      class="character"
    />

    <!-- PINTU -->
    <div id="door" class="door hidden">🚪</div>

  </div>

  <!-- DIALOG -->
  <div class="dialog">
    <p id="dialog-text">
      Syabil masih memakai piyama. Ia harus ganti baju dulu.
    </p>
    <button id="btn-change">Ganti Baju Sekolah</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
