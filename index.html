<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button data-room="home">🏠 Rumah</button>
      <button data-room="school">🏫 Sekolah</button>
      <button data-room="bedroom">🛏️ Kamar</button>
      <button data-room="kitchen">🍳 Dapur</button>
    </div>
  </header>

  <!-- 🏠 HALAMAN RUMAH -->
  <div class="room home active">
    <div class="yard-item tree">🌳</div>
    <div class="yard-item door-bedroom">🚪 Kamar</div>
    <div class="yard-item door-kitchen">🍽️ Dapur</div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🛏️ KAMAR -->
  <div class="room bedroom">
    <div class="item bed">🛏️</div>
    <div class="item wardrobe">👗</div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🍳 DAPUR -->
  <div class="room kitchen">
    <div class="food-container">
      <div class="food">🍎</div>
      <div class="food">🍞</div>
      <div class="food">🍰</div>
    </div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- 🏫 SEKOLAH -->
  <div class="room school">
    <div class="school-item">🎒</div>
    <div class="school-item">🧠</div>
    <div class="school-item">🤝</div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

</div>

<script src="./script.js"></script>
</body>
</html>
