<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button data-area="home">🏡 Rumah</button>
      <button data-area="school">🏫 Sekolah</button>
      <button data-area="bedroom">🛏️ Kamar</button>
      <button data-area="kitchen">🍳 Dapur</button>
    </div>
  </header>

  <!-- HOME -->
  <div class="room home active">
    🌳
    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- SCHOOL -->
  <div class="room school">
    🎒 🧠 🤝
    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- BEDROOM -->
  <div class="room bedroom">
    <div class="item bed">🛏️</div>
    <div class="item wardrobe">👗</div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- KITCHEN -->
  <div class="room kitchen">
    <div class="food-container">
      <div class="food">🍎</div>
      <div class="food">🍞</div>
      <div class="food">🍰</div>
    </div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- WALK CONTROL -->
  <div class="walk-control">
    <button id="walk-left">⬅️ Jalan</button>
    <button id="walk-right">➡️ Jalan</button>
  </div>

</div>

<script src="./script.js"></script>
</body>
</html>
