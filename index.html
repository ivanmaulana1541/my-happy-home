<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="game">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="left">⭐ <span id="star">0</span></div>
    <div class="right">
      <button id="btnHome">🏠 Rumah</button>
      <button id="btnMap">🗺️ Map</button>
    </div>
  </header>

  <!-- SCENE -->
  <div id="scene-container">

    <!-- BEDROOM -->
    <div class="scene bedroom active">
      <div class="character syabil"></div>
    </div>

    <!-- HOME -->
    <div class="scene home">
      <div class="character syabil"></div>
      <div class="character papa"></div>
      <div class="character mama"></div>
    </div>

    <!-- KITCHEN -->
    <div class="scene kitchen">
      <div class="character syabil"></div>
      <div class="character papa"></div>
      <div class="character mama"></div>
    </div>

    <!-- MAP -->
    <div class="scene map">
      <div class="map-icon home-icon" data-target="home"></div>
      <div class="map-icon school-icon" data-target="school"></div>
      <div class="map-icon office-icon" data-target="office"></div>
      <div class="map-icon market-icon" data-target="market"></div>
      <div class="map-icon dufan-icon" data-target="dufan"></div>
    </div>

    <!-- SCHOOL -->
    <div class="scene school">
      <div class="character syabil"></div>
      <div class="character teacher"></div>
    </div>

    <!-- OFFICE -->
    <div class="scene office">
      <div class="character papa"></div>
    </div>

    <!-- MARKET -->
    <div class="scene market">
      <div class="character mama"></div>
    </div>

    <!-- DUFAN -->
    <div class="scene dufan">
      <div class="family-dufan"></div>
    </div>

  </div>

  <!-- DIALOG -->
  <div id="dialog">
    <p id="dialogText"></p>
    <div id="dialogActions"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
