<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button data-area="map">🗺️ Map</button>
      <button data-area="home">🏠 Rumah</button>
      <button data-area="bedroom">🛏️ Kamar</button>
      <button data-area="kitchen">🍳 Dapur</button>
      <button data-area="school">🏫 Sekolah</button>
      <button data-area="office">🏢 Kantor</button>
      <button data-area="market">🛒 Market</button>
    </div>
  </header>

  <!-- QUEST BUTTON -->
  <button id="btn-quest" class="quest-btn">📋 Quest</button>

  <!-- QUEST PANEL -->
  <div id="quest-panel" class="quest-panel hidden">
    <h3>📋 Misi Hari Ini</h3>

    <div class="quest-tabs">
      <button class="tab active">👧 Syabil</button>
      <button class="tab">👨 Papa</button>
      <button class="tab">👩 Mama</button>
    </div>

    <ul></ul>
  </div>

  <!-- 🗺️ MAP (LAYAR PERTAMA) -->
  <div class="room map active">

    <!-- AREA KLIK TRANSPARAN DI PAPAN -->
    <div class="map-location home" data-target="home"></div>
    <div class="map-location school" data-target="school"></div>
    <div class="map-location office" data-target="office"></div>
    <div class="map-location market" data-target="market"></div>

  </div>

  <!-- 🏠 HOME -->
  <div class="room home">
    <div class="person father"><img src="./assets/father.png" alt="Papa"></div>
    <div class="person mother"><img src="./assets/mother.png" alt="Mama"></div>
    <div class="person child"><img src="./assets/child.png" alt="Syabil"></div>
  </div>

  <!-- 🛏️ BEDROOM -->
  <div class="room bedroom">
    <div class="item bed">🛏️</div>
    <div class="item wardrobe">👗</div>
    <div class="person child"><img src="./assets/child.png" alt="Syabil"></div>
  </div>

  <!-- 🍳 KITCHEN -->
  <div class="room kitchen">
    <div class="food-container">
      <div class="food">🍎</div>
      <div class="food">🍞</div>
      <div class="food">🍰</div>
    </div>
    <div class="person child"><img src="./assets/child.png" alt="Syabil"></div>
  </div>

  <!-- 🏫 SCHOOL -->
  <div class="room school">
    <div class="person child"><img src="./assets/child.png" alt="Syabil"></div>
  </div>

  <!-- 🏢 OFFICE -->
  <div class="room office">
    <div class="person father"><img src="./assets/father.png" alt="Papa"></div>
  </div>

  <!-- 🛒 MARKET -->
  <div class="room market">
    <div class="person mother"><img src="./assets/mother.png" alt="Mama"></div>
  </div>

</div>

<script src="./script.js"></script>
</body>
</html>
