<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>My Happy Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div class="game">

  <!-- TOP BAR -->
  <header class="top-bar">
    ⭐ <span id="star-count">0</span>

    <div class="nav">
      <button id="btn-home">🏠 Rumah</button>
      <button id="btn-school">🏫 Sekolah</button>
      <button id="btn-bedroom">🛏️ Kamar</button>
      <button id="btn-kitchen">🍳 Dapur</button>
    </div>
  </header>

  <!-- ================= RUMAH ================= -->
  <div class="room home active">
    <div class="family">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- ================= KAMAR ================= -->
  <div class="room bedroom">
    <div class="item bed">🛏️</div>
    <div class="item wardrobe">👗</div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- ================= DAPUR ================= -->
  <div class="room kitchen">
    <div class="food-container">
      <div class="food">🍎</div>
      <div class="food">🍞</div>
      <div class="food">🍰</div>
    </div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

  <!-- ================= SEKOLAH ================= -->
  <div class="room school">

    <div class="school-area">
      <div class="school-item bag">🎒</div>
      <div class="school-item board">🧠</div>
      <div class="school-item friend">🤝</div>
    </div>

    <div class="person">
      <img src="./assets/child.png" alt="Syabil">
    </div>
  </div>

</div>

<script src="./script.js"></script>
</body>
</html>
